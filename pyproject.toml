[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltacursor"
version = "0.1.1"
description = "Append-only journal that returns only what changed since an opaque cursor."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "cli", "journal", "cursor"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/deltacursor"
Repository = "https://github.com/perron/deltacursor"
Issues = "https://github.com/perron/deltacursor/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deltacursor = "deltacursor.cli:main"

[tool.setuptools.packages.find]
include = ["deltacursor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
