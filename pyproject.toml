[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltacursor"
version = "0.1.0"
description = "Append-only journal that returns only what changed since an opaque cursor."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deltacursor = "deltacursor.cli:main"

[tool.setuptools.packages.find]
include = ["deltacursor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
